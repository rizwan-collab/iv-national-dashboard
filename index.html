<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IV National Dashboard</title></head><body><style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#0c2340;--muted:#5c6470;--gold:#c79a3b;--line:#e3ddd0;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--card:#17202e;--ink:#e9edf3;--muted:#a3adbb;--line:#2a3546}}
:root[data-theme="dark"]{--bg:#0f1622;--card:#17202e;--ink:#e9edf3;--muted:#a3adbb;--line:#2a3546}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Lato",system-ui,-apple-system,Segoe UI,sans-serif}
.lk{min-height:100dvh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.lk form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:100%;max-width:360px;box-sizing:border-box;text-align:center}
.lk .mk{width:44px;height:44px;margin:0 auto 10px;border-radius:10px;background:#0c2340;color:var(--gold);display:grid;place-items:center;font:700 20px Georgia,serif}
.lk h1{font:700 20px Georgia,serif;margin:0 0 4px}.lk p{margin:0 0 18px;color:var(--muted);font-size:14px}
.lk input{width:100%;box-sizing:border-box;font:600 24px/1 system-ui;letter-spacing:.5em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lk input:focus{outline:2px solid var(--gold);outline-offset:1px}
.lk button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:8px;background:#0c2340;color:#fff;font:700 15px system-ui;cursor:pointer}
.lk button[disabled]{opacity:.6;cursor:wait}
.lk .er{color:var(--err);font-size:14px;min-height:20px;margin-top:10px}
.lk label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.lk label input{width:auto;letter-spacing:0;padding:0}
</style>
