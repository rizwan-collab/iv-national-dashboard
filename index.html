<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>IV National Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sticky brand header with search + region switch; left department rail; main view swaps by department (hash routes) */
:root{
  --paper:#F4F1EA; --card:#FFFFFF; --ink:#0B2A4A; --body:#3E4A5A; --muted:#6B7686; --line:#E2DCCF;
  --navy:#0B2A4A; --navy2:#14385E; --gold:#B8752A; --gold-soft:#F3E6D3; --chip:#EEF2F7;
  --ok:#2E7D5B; --warn:#B26B00; --crit:#B3261E; --warn-bg:#FFF4E0; --crit-bg:#FDECEA; --ok-bg:#E6F4EE;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Source Sans 3",Calibri,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A1828; --card:#10233A; --ink:#EAF0F7; --body:#C3CEDB; --muted:#8C9BAE; --line:#22384F;
  --navy:#0E2E50; --navy2:#173F68; --gold:#E0A35A; --gold-soft:#3A2C18; --chip:#1A3048;
  --ok:#5CC497; --warn:#F2B35B; --crit:#F2817A; --warn-bg:#3A2C10; --crit-bg:#3D1A18; --ok-bg:#12342A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1828; --card:#10233A; --ink:#EAF0F7; --body:#C3CEDB; --muted:#8C9BAE; --line:#22384F;
  --navy:#0E2E50; --navy2:#173F68; --gold:#E0A35A; --gold-soft:#3A2C18; --chip:#1A3048;
  --ok:#5CC497; --warn:#F2B35B; --crit:#F2817A; --warn-bg:#3A2C10; --crit-bg:#3D1A18; --ok-bg:#12342A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
a{color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
.top .bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:12px;max-width:1280px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em;color:#fff}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#E8C48F}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:6px;padding:9px 12px 9px 34px;font:inherit}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.75}
.regions{display:flex;gap:6px;flex-wrap:wrap}
.regions button{font:600 12px var(--sans);letter-spacing:.04em;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;cursor:pointer}
.regions button[aria-pressed="true"]{background:#E8C48F;border-color:#E8C48F;color:#0B2A4A}
.draftband{background:var(--gold-soft);color:var(--ink);font-size:13px;padding-block:7px;text-align:left}
.draftband .in{max-width:1280px;margin:0 auto}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:24px 60px}
nav.rail{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
nav.rail a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:6px;font-weight:600}
nav.rail a span.n{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
nav.rail a[aria-current="page"]{background:var(--card);box-shadow:inset 3px 0 0 var(--gold)}
nav.rail a:hover{background:var(--card)}
nav.rail a .flag{color:var(--crit);font-size:12px}
main{min-width:0}
h1{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:30px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.lede{max-width:68ch;margin:0 0 18px;color:var(--body)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--crit)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qa{display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:8px;padding:14px 16px;text-decoration:none;min-height:86px}
.qa:hover{background:var(--navy2)}
.qa .ic{flex:none;width:30px;height:30px;border-radius:6px;background:rgba(232,196,143,.18);display:grid;place-items:center;color:#E8C48F;font-weight:700}
.qa b{display:block;font-size:15px}
.qa small{color:#C9D6E4;font-size:12.5px}
.deptcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.deptcard:hover{border-color:var(--gold)}
.deptcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.deptcard .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.deptcard p{margin:0;font-size:13.5px;color:var(--body)}
.mix{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--chip)}
.mix i{display:block;height:100%}
.section{margin:26px 0}
.shead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.res{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:10px 12px;text-decoration:none;color:var(--ink);min-width:0}
.res:hover{border-color:var(--gold)}
.res:focus-visible,.qa:focus-visible,.deptcard:focus-visible,nav.rail a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.res .t{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.res .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.type{flex:none;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#fff}
.type svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.type.sm{width:26px;height:26px;border-radius:5px}.type.sm svg{width:15px;height:15px}
.fold{flex-direction:column;align-items:stretch;gap:0;padding:0;cursor:default}
.fold>.fhead{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;border-radius:7px}
.fold>.fhead:hover{background:var(--chip)}
.ftog{font:600 12px var(--sans);color:var(--muted);white-space:nowrap}
.fold.open{grid-column:1/-1;border-color:var(--gold)}
.fkids{border-top:1px solid var(--line);padding:6px 8px 10px;display:flex;flex-direction:column;gap:2px}
.fkids .fk{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;background:none;border:0;font:inherit;text-align:left;cursor:pointer;width:100%;min-width:0}
.fkids .fk:hover{background:var(--chip)}
.fkids .fk span.nm{overflow-wrap:anywhere;min-width:0}
.fkids .sub{margin-left:18px;border-left:2px solid var(--line);padding-left:6px}
.fkids .fmore{display:flex;gap:12px;flex-wrap:wrap;padding:6px 6px 0;font-size:13px}
#pv{width:min(1100px,calc(100vw - 32px));height:calc(100dvh - 48px);max-height:none;display:none;flex-direction:column}
#pv[open]{display:flex}
#pv .pvh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#pv .pvh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
#pv iframe{flex:1;border:0;width:100%;background:#fff}
#pv .pvnote{font-size:12.5px;color:var(--muted);padding:6px 14px;border-top:1px solid var(--line)}
.ty-doc{background:#3B6FB6}.ty-sheet{background:#2E8A57}.ty-slides{background:#C98A1B}.ty-folder{background:#6B7686}.ty-form{background:#7A4FB0}.ty-pdf{background:#B3473E}.ty-web{background:#0B2A4A}.ty-video{background:#C0392B}.ty-soon{background:#A8A39A}
.pill{font:600 11px var(--sans);letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--body)}
.pill.reg{background:var(--gold-soft);color:var(--ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.draft{background:var(--gold-soft);color:var(--gold)}
.callout{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:12px 14px;margin:14px 0;max-width:80ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
.sev{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--muted)}
.regiongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.regbtn{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;color:var(--ink)}
.regbtn b{font-family:var(--serif);font-size:18px;display:block}
.regbtn[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.empty{color:var(--muted);font-style:italic}
.tor{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;max-width:80ch;overflow-wrap:anywhere}
.tor h4{font:700 15px var(--sans);margin:16px 0 6px;color:var(--ink)}
.tor p{margin:0 0 10px}.tor ul{margin:0 0 12px;padding-left:20px}.tor li{margin:0 0 5px}
.tor .tmeta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.torall h2{margin:28px 0 8px}
.tor .tact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tor .tact a{text-decoration:none;display:inline-flex;align-items:center}
.res .rn{flex:none;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font:700 12px var(--sans);background:var(--navy);color:#fff}
.footer{color:var(--muted);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.mobilenav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:14px 40px}
  nav.rail{display:none}
  .mobilenav{display:flex;gap:6px;overflow-x:auto;padding-block:10px;-webkit-overflow-scrolling:touch}
  .mobilenav a{flex:none;text-decoration:none;font:600 13px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .mobilenav a[aria-current="page"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  h1{font-size:25px}
  .list{grid-template-columns:minmax(0,1fr)}
}

/* Workspace + people */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 18px;-webkit-overflow-scrolling:touch}
.tabs a{flex:none;text-decoration:none;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.wsbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 6px}
.wsbar label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex:1 1 260px}
.wsbar input{flex:1;min-width:0}
.wsmsg{font-size:13px;color:var(--ok);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px}
textarea{width:100%;resize:vertical}
.btn{font:600 14px var(--sans);border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);background:transparent}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){background:var(--gold);border-color:var(--gold);color:#0A1828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){background:var(--gold);border-color:var(--gold);color:#0A1828}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar .btn{margin-left:auto}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.toolbar .hint{margin:0;flex:1 1 260px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.seg button{font:600 13px var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;min-height:36px;cursor:pointer}
.seg button span{color:var(--muted);font-weight:400}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button[aria-pressed="true"] span{color:#C9D6E4}
.sbtn{font:inherit;text-align:left;cursor:pointer}
.sbtn[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ihead b{color:var(--ink);font-size:15px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--body);align-items:center}
.meta .late{color:var(--crit);font-weight:600}
.inote{margin:0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ifoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;color:var(--muted)}
.item h4{margin:4px 0 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.acts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.acts li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:-4px 0 10px}.prog i{display:block;height:100%;background:var(--ok)}
.checks,.dates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li,.dates li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.checks li.done .ct b{text-decoration:line-through;color:var(--muted)}
.ct{flex:1;min-width:0;display:flex;flex-direction:column}.ct b{color:var(--ink);overflow-wrap:anywhere}.ct small{color:var(--muted);font-size:13px}
.tick{flex:none;width:32px;height:32px;border-radius:6px;border:2px solid var(--line);background:var(--paper);color:#fff;font-weight:700;cursor:pointer}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.cal{flex:none;width:58px;text-align:center;border-right:1px solid var(--line);padding-right:10px}.cal b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1}.cal small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dates.past li{opacity:.7}
.cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--body);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(6,16,28,.55)}
dialog form{display:flex;flex-direction:column;gap:6px;padding:18px}
dialog label{font-size:13px;font-weight:600;color:var(--ink);margin-top:6px}
dialog input,dialog select{width:100%}
.dlgfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard b{color:var(--ink);display:block}.pcard small{color:var(--muted);font-size:13px;display:block}
.pcard.vac{border-style:dashed;background:transparent}.pcard.vac b{color:var(--muted)}
.pmeta{display:flex;flex-wrap:wrap;gap:5px}
.plinks{display:flex;flex-direction:column;gap:2px;font-size:13.5px}.plinks a{color:var(--navy2);overflow-wrap:anywhere;text-decoration:none;padding:2px 0}.plinks a:hover{text-decoration:underline}
:root[data-theme="dark"] .plinks a{color:#9CC3EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plinks a{color:#9CC3EA}}
.org{display:flex;flex-direction:column;gap:0}
.tier{position:relative;padding:12px 0 18px}
.tier+.tier::before{content:"";position:absolute;left:50%;top:-6px;height:14px;border-left:2px solid var(--line)}
.tier h4{text-align:center;margin:0 0 10px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tier h4 span{color:var(--muted)}
.nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.node{font:inherit;text-align:center;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:8px;padding:9px 12px;min-width:170px;max-width:240px;flex:1 1 170px;color:var(--body)}
.node b{display:block;color:var(--ink);font-size:14.5px}.node small{display:block;font-size:12.5px;color:var(--muted)}
.node.lead{border-top-color:var(--gold);flex-grow:0}.node.dep{border-top-color:var(--navy2)}.node.jk{min-width:150px;flex-basis:150px}
.node.vac{border-style:dashed}
.node.link{cursor:pointer}.node.link:hover{border-color:var(--gold)}
.fgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fg{background:var(--chip);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.fg h5{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-align:center}
.fg .node{max-width:none;flex:none}
@media (max-width:860px){
  .top .bar{gap:10px;padding-block:10px}
  .brand b{font-size:17px}
  .search{flex-basis:100%;order:3}
  .regions{order:4;flex-wrap:nowrap;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .regions button{flex:none;min-height:34px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}

function viewRequests(){
  loadCR();
  let h='<h3>Feedback</h3><h1>Change requests</h1><p class="lede">Send a fix, addition or rewording. Each request gets an ID and status.</p>';
  h+='<p><a class="qa" style="display:inline-flex;max-width:340px" href="'+esc(CR.form)+'" target="_blank" rel="noopener"><span class="ic">+</span><span><b>Request a change</b><small>Short form · name, where, what, screenshot link, comments</small></span></a></p>';
  if(CR.err){return h+'<p class="empty">'+esc(CR.err)+' <a href="https://docs.google.com/spreadsheets/d/'+CR.sheet+'" target="_blank" rel="noopener">Open the tracker</a>.</p>'}
  if(!CR.rows){return h+'<p class="empty">Loading requests…</p>'}
  const R=CR.rows,st=x=>x['Status']||'New';
  const cnt=k=>R.filter(x=>st(x)===k).length;
  h+='<div class="stats"><div class="stat"><b>'+R.length+'</b><span>requests</span></div><div class="stat alert"><b>'+cnt('New')+'</b><span>new</span></div><div class="stat"><b>'+(cnt('In progress')+cnt('Needs decision'))+'</b><span>in progress / needs decision</span></div><div class="stat"><b>'+cnt('Done')+'</b><span>done</span></div></div>';
  if(!R.length)return h+'<p class="empty">No requests yet. Use the button above to send the first one.</p>';
  const pc={'New':'warn','In progress':'draft','Needs decision':'crit','Done':'ok',"Won't do":''};
  h+='<div class="section"><div class="tablewrap"><table><thead><tr><th>ID</th><th>Request</th><th>Where</th><th>From</th><th>Priority</th><th>Status</th><th>Notes</th></tr></thead><tbody>'+R.slice().reverse().map(x=>{
    const extra=[x['Link or file name (optional)'],x['Screenshot link (optional)']].filter(Boolean).map(v=>/^https?:/.test(v)?'<a href="'+esc(v)+'" target="_blank" rel="noopener">'+(v===x['Screenshot link (optional)']?'Screenshot':'Link')+'</a>':esc(v)).join(' · ');
    const com=x['Comments (optional)']?'<br><small style="color:var(--muted)">'+esc(x['Comments (optional)'])+'</small>':'';
    return '<tr><td>'+esc(x['ID']||'')+'</td><td>'+esc(x['What should change?'])+com+(extra?'<br><small>'+extra+'</small>':'')+'</td><td>'+esc(x['Where is the change?']||'')+'</td><td>'+esc(x['Your name']||'')+'<br><small style="color:var(--muted)">'+esc(x['Timestamp']||'')+'</small></td><td>'+esc(x['Priority']||'')+'</td><td><span class="pill '+(pc[st(x)]||'')+'">'+esc(st(x))+'</span></td><td>'+esc(x['Notes / resolution']||'')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  h+='<p class="lede" style="font-size:13px">Statuses are updated by the National IV team in the tracker sheet. Refresh this page to see the latest.</p>';
  return h;
}

  fetch(STORE.url+'?t='+Date.now(),{credentials:'omit'}).then(r=>r.json()).then(r=>{STORE.loading=false;STORE.err=null;STORE.items=(r&&r.items)||[];render()})

async function storeSend(op,item){
  STORE.saving++;STORE.msg='Saving…';render();

    const j=await r.json().catch(()=>null);ok=!j||j.ok!==false;if(j&&j.id&&op!=='delete')item.id=j.id}
  catch(e){ok=null}

  if(ok===false){STORE.msg='Not saved. Please try again.';render();return false}
  if(op==='delete')STORE.items=STORE.items.filter(x=>x.id!==item.id);
  else{const i=STORE.items.findIndex(x=>x.id===item.id);item.updated=new Date().toISOString();if(i>=0)STORE.items[i]=item;else if(item.id)STORE.items.push(item)}

function openEditor(type,obj){
  const x=Object.assign({},obj||{});const F=FIELDS[type];
  const dlg=document.getElementById('dlg');
  dlg.innerHTML='<form method="dialog" id="edform"><h2>'+(x.id?'Edit ':'Add ')+TNAME[type]+'</h2>'+F.map(([k,l,t,req,opts])=>{
    const v=x[k]==null?'':x[k];const id='f_'+k;
    let inp=t==='area'?'<textarea id="'+id+'" name="'+k+'" rows="3">'+esc(v)+'</textarea>':t==='select'?'<select id="'+id+'" name="'+k+'">'+opts.map(o=>'<option'+(String(v)===o?' selected':'')+' value="'+esc(o)+'">'+esc(o||'—')+'</option>').join('')+'</select>':'<input id="'+id+'" name="'+k+'" type="'+t+'" value="'+esc(v)+'"'+(req?' required':'')+'>';
    return '<label for="'+id+'">'+esc(l)+(req?' <span aria-hidden="true">*</span>':'')+'</label>'+inp}).join('')+
    '<div class="dlgfoot">'+(x.id?'<button type="button" class="btn danger" id="eddel">Delete</button>':'<span></span>')+'<span><button type="button" class="btn ghost" id="edcancel">Cancel</button> <button class="btn" type="submit">Save</button></span></div></form>';
  dlg.showModal();
  dlg.querySelector('#edcancel').onclick=()=>dlg.close();
  const del=dlg.querySelector('#eddel');if(del)del.onclick=async()=>{if(!confirm('Delete this '+TNAME[type]+'?'))return;dlg.close();await storeSend('delete',{id:x.id,type:type,by:me()})};
  dlg.querySelector('#edform').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const it={id:x.id||'',type:type,by:me()};
    for(const [k] of F)it[k]=String(fd.get(k)||'').trim();dlg.close();await storeSend('upsert',it)};
}
async function addStarter(){
  if(!confirm('Add '+Object.values(STARTER).flat().length+' starter checklist items? You can edit or delete any of them.'))return;
  for(const [r,list] of Object.entries(STARTER))for(const t of list)await storeSend('upsert',{type:'check',role:r,title:t,done:'No',by:me()||'Starter checklist (DRAFT)'});
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='new'){openEditor(a.dataset.type,a.dataset.pre?JSON.parse(a.dataset.pre):{})}
    else if(act==='edit'){const x=(STORE.items||[]).find(i=>i.id===a.dataset.id);if(x)openEditor(x.type,x)}
    else if(act==='tick'){const x=(STORE.items||[]).find(i=>i.id===a.dataset.id);if(x)storeSend('upsert',Object.assign({},x,{done:x.done==='Yes'?'No':'Yes',by:me()}))}
    else if(act==='reload'){loadStore(true)}
    else if(act==='starter'){addStarter()}
    else if(act==='totask'){const p=a.dataset.line.split(/\s+[-–—]\s+/);openEditor('task',{title:p[1]||p[0],owner:p[1]?p[0]:'',due:/^\d{4}-\d\d-\d\d$/.test(p[2]||'')?p[2]:'',scope:'National',status:'Not started',notes:'From meeting: '+a.dataset.from})}
    return}
  const w=e.target.closest('[data-ws]');if(w){WS[w.dataset.ws]=w.dataset.v;render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='me')setMe(e.target.value.trim());

  if(e.target.id==='orgsel'){WS.orgreg=e.target.value;render()}

function torList(){const live=items('tor').filter(x=>!x.meta&&Array.isArray(x.blocks));return live.length?live.slice().sort((a,b)=>String(a.n).localeCompare(String(b.n))):TOR_SNAP}
function torCard(r){const rp=torReports(r);return '<a class="res" href="#tor/'+esc(torSlug(r))+'"><span class="rn">'+esc(r.n)+'</span><span style="min-width:0"><span class="t">'+esc(r.name)+'</span>'+(rp?'<small style="display:block;color:var(--muted);font-size:13px;margin-top:2px">Reports to '+esc(rp)+'</small>':'')+'<span class="m"><span class="pill reg">'+esc(r.applies)+'</span></span></span></a>'}

function torDoc(r){return r.doc||TOR_LINKS.docs[torSlug(r)]||''}
function runsHTML(rs){return (rs||[]).map(x=>{let s=esc(x[0]);if(x[2])s='<i>'+s+'</i>';if(x[1])s='<b>'+s+'</b>';return s}).join('')}

function torReports(r){const b=(r.blocks||[]).find(b=>b.t==='p'&&/^reports to/i.test((b.r[0]||[''])[0]));return b?b.r.map(x=>x[0]).join('').replace(/^reports to:\s*/i,''):''}

    const top=N.filter(o=>/NC Member/i.test(o.role)),co=N.filter(o=>/Co-Lead/i.test(o.role)&&/^IV/i.test(o.role));
    const fn=[['Operations & technology',/ops|technology/i],['Youth',/youth/i],['Disaster management',/dmt/i],['Safety & security',/s&s|security special/i],['Training',/training/i]];
    const used=new Set(top.concat(co));
    h+='<div class="org">'+tier('National Council',top,'lead')+tier('National IV leadership',co,'lead')+'<div class="tier"><h4>Functional leads</h4><div class="fgroups">'+fn.map(([n,re])=>{const L=N.filter(o=>!used.has(o)&&re.test(o.role));L.forEach(o=>used.add(o));return L.length?'<div class="fg"><h5>'+n+'</h5>'+L.map(o=>node(o)).join('')+'</div>':''}).join('')+(N.filter(o=>!used.has(o)).length?'<div class="fg"><h5>Other</h5>'+N.filter(o=>!used.has(o)).map(o=>node(o)).join('')+'</div>':'')+'</div></div>';
    h+='<div class="tier"><h4>Regional IV Leads <span>7</span></h4><div class="nodes">'+DIR.filter(o=>o.team==='IV Leads').map(o=>'<button class="node link" data-ws="orgreg" data-v="'+esc(o.region)+'"><b>'+esc(o.name)+'</b><small>'+esc(o.region)+' · open chart →</small></button>').join('')+'</div></div></div>';
    h+='<p class="hint">National IV Youth reports through the Youth lead; each region’s youth leads are in the Directory under IV Youth team.</p>';
    return h;
  }
  const R=DIR.filter(o=>o.team==='Regional'&&o.region===reg);
  const Y=DIR.filter(o=>o.team==='Youth'&&o.region===reg);
  h+='<div class="org">'+tier('Council Member / IV Lead',R.filter(o=>lvl(o.role,o.jk)===1),'lead')+tier('Deputies',R.filter(o=>lvl(o.role,o.jk)===2),'dep')+tier('Regional functional leads',R.filter(o=>lvl(o.role,o.jk)===3))+tier('IV Youth (regional)',Y)+tier('Jamatkhana directors',R.filter(o=>lvl(o.role,o.jk)===4),'jk')+'</div>';
  h+='<p class="hint">Grouped by role title in the directory. If someone sits in the wrong tier, send a change request and we’ll fix it.</p>';
  return h;
}

const ROUTES=['overview'].concat(DEPTS.map(d=>d.id),['regions','handover','review','requests','work','people','tor']);
function navHTML(cur){
  const link=(id,name,n,flag)=>'<a href="#'+id+'"'+(cur===id?' aria-current="page"':'')+'>'+esc(name)+'<span class="n">'+(flag?'<span class="flag">●</span> ':'')+(n??'')+'</span></a>';
  let h='<span class="lbl">Dashboard</span>'+link('overview','Overview','');
  h+='<span class="lbl">Departments</span>'+DEPTS.map(d=>link(d.id,({dmt:'DMT',admin:'Admin'})[d.id]||d.name,deptItems(d.id).length,flagsFor(d.id).some(f=>f.sev==='crit'))).join('');
  h+='<span class="lbl">Collaborate · pilot</span>'+link('work','Workspace',STORE.items?items('task').filter(x=>x.status!=='Done').length:'')+link('people','Directory',DIR.filter(o=>o.name!=='(vacant)').length);
  h+='<span class="lbl">More</span>'+link('regions','Regions',state.region?RN[state.region]:'7')+link('handover','Handover',HANDOVER.length)+link('review','Health check',FLAGS.filter(f=>f.st!=='fixed').length,true)+link('requests','Change requests',CR.rows?CR.rows.filter(x=>(x['Status']||'New')!=='Done'&&x['Status']!=="Won't do").length:'');
  return h;
}
function render(){
  loadFolders();
  const raw=(location.hash||'#overview').slice(1);const base=raw.split('/')[0],sub=raw.split('/')[1]||'';const cur=ROUTES.includes(base)?base:'overview';
  document.getElementById('rail').innerHTML=navHTML(cur==='tor'?'iv':cur);
  document.getElementById('mnav').innerHTML=['overview'].concat(DEPTS.map(d=>d.id),['work','people','regions','handover','review','requests']).map(id=>{const d=DEPTS.find(x=>x.id===id);const n=d?d.short:{overview:'Overview',regions:'Regions',handover:'Handover',review:'Health check',requests:'Requests',work:'Workspace',people:'Directory',tor:'ToRs'}[id];return '<a href="#'+id+'"'+((cur==='tor'?'iv':cur)===id?' aria-current="page"':'')+'>'+esc(n)+'</a>'}).join('');
  document.getElementById('regions').innerHTML='<button data-reg="" aria-pressed="'+(!state.region)+'">All</button>'+REGIONS.map(r=>'<button data-reg="'+r+'" aria-pressed="'+(state.region===r)+'">'+RN[r]+'</button>').join('');
  const act=document.querySelector('#mnav [aria-current]');if(act&&act.scrollIntoView)act.scrollIntoView({block:'nearest',inline:'center'});
  const m=document.getElementById('main');
  let h;
  if(state.q.trim())h=viewSearch(state.q.trim());
  else if(cur==='overview')h=viewOverview();
  else if(cur==='regions')h=viewRegions();
  else if(cur==='handover')h=viewHandover();
  else if(cur==='review')h=viewReview();
  else if(cur==='requests')h=viewRequests();
  else if(cur==='work')h=viewWork(sub);
  else if(cur==='people')h=viewPeople(sub);
  else if(cur==='tor')h=viewTor(sub);
  else h=viewDept(DEPTS.find(d=>d.id===cur));
  m.innerHTML=h+'<div class="footer">DRAFT · Built from the National Dashboard site and the IV 2023–2026 Drive folder, 4 Nov 2026 · Links open the hub copies (forms and a few restricted items open the originals); access depends on your Google account.</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-reg]');if(!b)return;
  const r=b.getAttribute('data-reg')||null;state.region=(r&&state.region===r&&b.closest('.regiongrid'))?r:r;
  try{state.region?localStorage.setItem('ivdash-region',state.region):localStorage.removeItem('ivdash-region')}catch(err){}
  render();
});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render()});
window.addEventListener('hashchange',()=>{state.q='';document.getElementById('q').value='';render();window.scrollTo(0,0)});
render();
</script>
